version: "3.9"
services:
  postgres:
    image: postgres:16-alpine
    container_name: lifeplanner-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeplanner
      POSTGRES_PASSWORD: lifeplanner
      POSTGRES_DB: lifeplanner
    ports: ["5432:5432"]
    volumes: ["lifeplanner-pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeplanner"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    container_name: lifeplanner-redis
    restart: unless-stopped
    ports: ["6379:6379"]
    volumes: ["lifeplanner-redisdata:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  lifeplanner-pgdata:
  lifeplanner-redisdata:
