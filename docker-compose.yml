# Local Postgres + Redis for development convenience.
#   docker compose up -d
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: lifeplanner
      POSTGRES_PASSWORD: lifeplanner
      POSTGRES_DB: lifeplanner
    ports:
      - "5432:5432"
    volumes:
      - lp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lifeplanner"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - lp_redisdata:/data

volumes:
  lp_pgdata:
  lp_redisdata:
